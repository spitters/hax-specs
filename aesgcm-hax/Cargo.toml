[package]
name = "aesgcm-hax"
version = "0.1.0"
edition = "2021"
description = "AES-GCM (NIST SP 800-38D) with AES-128/AES-256 (FIPS 197) and GHASH over GF(2^128), as a hax-extractable, no_std, fixed-size-array Rust specification"
license = "MIT"
repository = "https://github.com/spitters/hax-specs"
readme = "README.md"
keywords = ["cryptography", "aes", "gcm", "hax", "formal-verification"]
categories = ["cryptography"]

[dependencies]

[dev-dependencies]
# RustCrypto AES-GCM, used only as a test oracle
aes-gcm = "0.10.3"
