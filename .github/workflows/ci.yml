name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: ${{ matrix.crate }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate:
          - aesccm-hax
          - aesgcm-hax
          - aesgcmsiv-hax
          - aeskw-hax
          - cmac-hax
          - ctrdrbg-hax
          - hashdrbg-hax
          - hmacdrbg-hax
          - kbkdf-hax
          - kmac-hax
          - plonky3-hax
          - xtsaes-hax
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ matrix.crate }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ matrix.crate }}-
      - name: Test
        run: cargo test --release -p ${{ matrix.crate }}
      - name: Clippy
        run: cargo clippy -p ${{ matrix.crate }} --all-targets -- -D warnings
      - name: Rustdoc
        run: cargo doc --no-deps -p ${{ matrix.crate }}
        env:
          RUSTDOCFLAGS: -D warnings

  hax-lint:
    name: hax-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The linter lives in the hax-skills repository. Until that repository is
      # public the clone is refused; the job then skips with a notice rather
      # than failing or passing silently.
      - name: Probe hax-skills
        id: probe
        continue-on-error: true
        run: git ls-remote --exit-code https://github.com/spitters/hax-skills HEAD
      - name: hax-skills not reachable
        if: steps.probe.outcome != 'success'
        run: echo "::notice::hax-skills is not reachable (private); lint skipped"
      - name: Install hax-treesitter
        if: steps.probe.outcome == 'success'
        run: pip install "git+https://github.com/spitters/hax-skills#subdirectory=hax-treesitter"
      - name: Lint member crates
        if: steps.probe.outcome == 'success'
        run: |
          for crate in *-hax; do
            hax-lint --errors-only --no-color "$crate"/src/*.rs
          done
