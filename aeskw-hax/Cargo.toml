[package]
name = "aeskw-hax"
version = "0.1.0"
edition = "2021"
description = "Hax-extractable pure-Rust specification of AES Key Wrap (NIST SP 800-38F / RFC 3394) with an AES-128 KEK"
license = "MIT"
repository = "https://github.com/spitters/hax-specs"
readme = "README.md"
keywords = ["cryptography", "aes", "key-wrap", "hax", "formal-verification"]
categories = ["cryptography"]

[dependencies]

[dev-dependencies]
hex-literal = "0.4"
# RustCrypto AES Key Wrap, used only as a test oracle in tests/cross_check.rs
aes-kw = "0.2"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
