[package]
name = "kbkdf-hax"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "KBKDF in Counter Mode with HMAC-SHA-256 (NIST SP 800-108 Rev. 1, Section 4.1) in a hax-extractable Rust subset"
repository = "https://github.com/spitters/hax-specs"
readme = "README.md"
keywords = ["cryptography", "kdf", "hmac", "hax", "formal-verification"]
categories = ["cryptography"]

[dependencies]

[dev-dependencies]
hex-literal = "0.4"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
