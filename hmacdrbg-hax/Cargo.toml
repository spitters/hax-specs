[package]
name = "hmacdrbg-hax"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "HMAC_DRBG with SHA-256 (NIST SP 800-90A Rev. 1, Section 10.1.2) in a hax-extractable Rust subset"
repository = "https://github.com/spitters/hax-specs"
readme = "README.md"
keywords = ["cryptography", "drbg", "hmac", "hax", "formal-verification"]
