[package]
name = "xtsaes-hax"
version = "0.1.0"
edition = "2021"
description = "XTS-AES-128 (IEEE Std 1619-2018) as a hax-extractable, no_std, fixed-size-array Rust specification"
license = "MIT"
repository = "https://github.com/spitters/hax-specs"
readme = "README.md"
keywords = ["cryptography", "aes", "xts", "hax", "formal-verification"]
categories = ["cryptography"]

[dependencies]

[dev-dependencies]
hex-literal = "0.4"
# RustCrypto XTS-AES, used only as a test oracle
xts-mode = "0.5"
aes = "0.8"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
